[package]
name = "lector"
version = "0.1.0"
edition = "2024"
description = "A minimal Markdown viewer"
license = "MIT"

[dependencies]
eframe = "0.36"
egui_commonmark = { version = "0.25", features = ["better_syntax_highlighting", "svg", "fetch", "embedded_image"] }
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
