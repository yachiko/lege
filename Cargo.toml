[package]
name = "lege"
version = "0.1.1"
edition = "2024"
description = "A minimal Markdown viewer"
license = "MIT"

[dependencies]
ammonia = "4.2.3"
comrak = { version = "0.56.0", default-features = false, features = ["syntect-fancy"] }
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
tao = "0.37.1"
wry = "0.57.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
png = "0.18.1"
