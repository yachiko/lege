[package]
name = "lector"
version = "0.1.0"
edition = "2024"
description = "A minimal Markdown viewer"
license = "MIT"

# The project is lector; the command is short for speed of typing.
[[bin]]
name = "lege"
path = "src/main.rs"

[dependencies]
ammonia = "4.2.3"
comrak = { version = "0.56.0", default-features = false, features = ["syntect-fancy"] }
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
tao = "0.37.1"
wry = "0.57.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
