<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src * data: blob:; media-src *">
<title>{{title}}</title>
<link rel="stylesheet" href="/_lege/style.css">
<script src="/_lege/app.js" defer></script>
</head>
<body class="{{class}} booting" data-mtime="{{mtime}}" data-shards="{{shards}}">
<nav id="sidebar">{{sidebar}}</nav>
<div id="resizer"></div>
<button id="sidebar-toggle" type="button" title="Toggle sidebar (F4)" aria-label="Toggle sidebar"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<main id="canvas"><article id="page">{{content}}</article><div class="page-edge left"></div><div class="page-edge right"></div></main>
<div id="search" hidden>
<input id="search-input" type="text" placeholder="Search files and text" autocomplete="off" spellcheck="false" aria-label="Search">
<div id="search-results"></div>
</div>
</body>
</html>
